<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pony Love Harvest & Network Matrix</title>
    <script type="text/javascript">
      // Single Page App redirect fallback for GitHub Pages
      var l = window.location;
      if (l.search) {
        var q = l.search.slice(1).split('&').map(function(s) { return s.replace(/~and~/g, '&'); }).join('?');
        window.history.replaceState(null, null, './?' + q + l.hash);
      } else {
        window.history.replaceState(null, null, './');
      }
    </script>
    <meta http-equiv="refresh" content="0;URL='./'" />
  </head>
  <body>
    <div style="background:#020617; color:#f1f5f9; font-family:sans-serif; height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:20px;">
      <h2 style="font-size:20px; font-weight:bold; margin-bottom:8px;">Loading Pony Love Network...</h2>
      <p style="font-size:14px; opacity:0.7;">Redirecting to application...</p>
    </div>
  </body>
</html>
